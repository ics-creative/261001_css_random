<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>3. Random Starry Sky Demo</title>
  <link href="../base.css" rel="stylesheet" />
  <style>
    body {
      background: #08071d;
    }

    .sky {
      position: relative;
      width: min(92vw, 980px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 110%, rgb(124 113 246 / 28%), transparent 42%),
        linear-gradient(#0b0a24, #17123f);
      box-shadow: 0 28px 80px rgb(0 0 0 / 30%);
    }

    .copy {
      position: absolute;
      inset: 50% auto auto 50%;
      z-index: 1;
      width: 90%;
      color: #fff;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .copy small {
      display: block;
      margin-bottom: 8px;
      color: #b8b0ff;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .copy strong {
      display: block;
      font-size: clamp(38px, 7vw, 78px);
      line-height: 1;
    }

    .star {
      position: absolute;
      /* 位置・大きさ・発光の強さを星ごとに変える */
      top: random(3%, 96%);
      left: random(2%, 98%);
      width: random(2px, 7px);
      aspect-ratio: 1;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 random(4px, 16px) rgb(184 176 255 / 90%);
      opacity: 0.25;
      animation:
        twinkle
        random(1.1s, 3.8s)
        ease-in-out
        random(-3.5s, 0s)
        infinite alternate;
    }

    @keyframes twinkle {
      to {
        opacity: 1;
        transform: scale(1.45);
      }
    }
  </style>
</head>
