<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>3. Random Text Delay Demo</title>
  <link href="../base.css" rel="stylesheet" />
  <style>
    .panel {
      width: min(92vw, 980px);
      padding: clamp(36px, 7vw, 84px);
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgb(50 35 179 / 10%);
    }

    .headline {
      margin: 0;
      color: #3223b3;
      font-size: 30px;
      line-height: 1.17;
      cursor: pointer;
    }

    .line {
      display: block;
    }

    .char,
    .space {
      display: inline-block;
    }

    .char {
      color: #3223b3;
    }

    .headline:hover .char {
      /* 文字ごとに違う delay を割り当てる */
      animation:
        flash 500ms ease
        random(0ms, 600ms);
    }

    @keyframes flash {
      50% {
        color: #7c71f6;
      }
    }

    @supports not (width: random(1px, 2px)) {
      .supported-content {
        display: none !important;
      }

      .unsupported {
        display: block;
      }
    }
  </style>
</head>

<body>
<main class="panel">
  <div class="supported-content">
    <h1 class="headline">
      <span class="line"><span class="char">I</span><span class="char">C</span><span class="char">S</span><span class="space">&nbsp;</span><span class="char">M</span><span class="char">E</span><span class="char">D</span><span class="char">I</span><span class="char">A</span></span>
      <span class="line"><span class="char">C</span><span class="char">S</span><span class="char">S</span><span class="space">&nbsp;</span><span class="char">r</span><span class="char">a</span><span class="char">n</span><span class="char">d</span><span class="char">o</span><span class="char">m</span><span class="char">(</span><span class="char">)</span><span class="space">&nbsp;</span><span class="char">I</span><span class="char">d</span><span class="char">e</span><span class="char">a</span><span class="char">s</span></span>
    </h1>
  </div>

  <p class="unsupported">View this demo in Safari 26.2 or later.<br>It uses CSS random().</p>
</main>
</body>
</html>
